services:
  - type: web
    name: nexuscales
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: ADMIN_TOKEN
        generateValue: true
      - key: LEAD_WEBHOOK_URL
        sync: false
